<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NỘI NĂNG. ĐỊNH LUẬT I CỦA NHIỆT ĐỘNG LỰC HỌC (1)</title>
<style>
  :root{
    --bg1:#0f2027;
    --bg2:#203a43;
    --bg3:#2c5364;
    --accent:#38bdf8;
    --accent2:#818cf8;
    --green:#22c55e;
    --red:#ef4444;
    --card:#0f1b2b;
    --text:#f1f5f9;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--text);
    overflow:hidden;
    background:#05080b;
  }
  /* Khung sân khấu cố định 1280x720 (16:9), JS co giãn theo màn hình chiếu */
  #stage{
    position:fixed;
    top:50%;left:50%;
    width:1280px;height:720px;
    transform-origin:center center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    box-shadow:0 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  #app{
    height:100%;width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #fullscreen-btn{
    position:absolute;
    top:8px;right:18px;
    z-index:999;
    background:rgba(15,27,43,0.85);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(6px);
    transition:all .2s;
  }
  #fullscreen-btn:hover{
    background:rgba(56,189,248,0.25);
    border-color:var(--accent);
  }
  .header{
    text-align:center;
    margin-bottom:8px;
  }
  .header-banner{
    position:relative;
    width:1180px;
    height:95px;
    margin:0 auto 8px auto;
    padding:0;
    border-radius:26px;
    overflow:hidden;
    background:#102b34;
    border:1px solid rgba(125,211,252,0.28);
    box-shadow:0 10px 30px rgba(0,0,0,0.28);
  }
  .header-banner img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }
  .deco{ position:absolute; pointer-events:none; }
  .deco-school{
    left:16px; top:50%; transform:translateY(-50%);
    width:64px; height:64px; opacity:0.85;
  }
  .deco-molecule{
    right:16px; top:50%; transform:translateY(-50%);
    width:70px; height:70px; opacity:0.85;
    animation:spin-slow 14s linear infinite;
  }
  .deco-snow{ left:88px; top:8px; width:26px; height:26px; opacity:0.7; }
  .deco-thermo{ right:92px; top:6px; width:16px; height:34px; opacity:0.75; }
  .deco-drops{ left:0; bottom:4px; width:100%; height:16px; opacity:0.55; }
  @keyframes spin-slow{
    from{ transform:translateY(-50%) rotate(0deg); }
    to{ transform:translateY(-50%) rotate(360deg); }
  }
  @media (max-width:640px){
    .deco-school,.deco-molecule{ width:44px; height:44px; }
    .deco-snow,.deco-thermo{ display:none; }
  }
  .school-strip{
    position:relative;
    width:100%;
    height:86px;
    border-radius:18px 18px 0 0;
    overflow:hidden;
    margin:-22px -20px 14px -20px;
    width:calc(100% + 40px);
  }
  .school-strip img{
    width:100%;height:100%;object-fit:cover;
    filter:brightness(0.62) saturate(1.05);
  }
  .school-strip::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,32,39,0.15) 0%, rgba(15,32,39,0.55) 65%, rgba(15,32,39,0.92) 100%);
  }
  .school-id{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
  }
  .school-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.55);
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    background:#fff;
  }
  .school-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#e2e8f0;
    text-transform:uppercase;
  }
  .header h1{
    font-size:26px;
    margin:0 0 6px 0;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .progress-wrap{
    width:1180px;
    margin:0 auto 18px auto;
  }
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:14px;color:var(--muted);margin-bottom:6px;
  }
  .progress-bar{
    width:100%;height:10px;border-radius:6px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .35s ease;
  }
  .card{
    width:1180px;
    background:rgba(15,27,43,0.85);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:22px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;
    backdrop-filter:blur(6px);
    height:400px;
    max-height:400px;
    overflow-y:auto;
  }
  .qnum-row{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    column-gap:18px;
    margin-bottom:22px;
  }
  .qnum{
    display:inline-block;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;
    font-weight:800;
    padding:6px 18px;
    border-radius:999px;
    font-size:15px;
    letter-spacing:1px;
  }
  .timer-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:999px;
    padding:6px 16px;
    font-weight:800;
    font-size:15px;
    min-width:70px;
    justify-content:center;
    transition:all .2s;
  }
  .timer-badge .clock-icon{font-size:16px;}
  .timer-badge.warn{
    border-color:#facc15;
    color:#facc15;
    background:rgba(250,204,21,0.12);
  }
  .timer-badge.danger{
    border-color:var(--red);
    color:var(--red);
    background:rgba(239,68,68,0.15);
    animation:pulse .6s infinite;
  }
  .timer-badge.stopped{
    opacity:0.4;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  .qtext{
    font-size:24px;
    line-height:1.35;
    margin:0;
    font-weight:600;
    min-width:0;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:18px;
  }
  @media (max-width:600px){
    .options{grid-template-columns:1fr;}
  }
  .opt-btn{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.12);
    color:var(--text);
    padding:14px 16px;
    border-radius:14px;
    font-size:24px;
    cursor:pointer;
    transition:all .18s ease;
    line-height:1.4;
  }
  .opt-btn:hover:not(.disabled){
    border-color:var(--accent);
    background:rgba(56,189,248,0.12);
    transform:translateY(-2px);
  }
  .opt-btn .badge{
    flex:0 0 auto;
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:21px;
  }
  .opt-btn.correct{
    background:rgba(34,197,94,0.22);
    border-color:var(--green);
  }
  .opt-btn.correct .badge{background:var(--green);color:#052e12;}
  .opt-btn.wrong{
    background:rgba(239,68,68,0.22);
    border-color:var(--red);
    animation:shake .35s;
  }
  .opt-btn.wrong .badge{background:var(--red);color:#3f0505;}
  .opt-btn.disabled{cursor:default;opacity:0.55;}
  .opt-btn.disabled.correct,.opt-btn.disabled.wrong{opacity:1;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .feedback{
    min-height:30px;
    font-weight:800;
    font-size:16px;
    margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .feedback.correct{color:var(--green);}
  .feedback.wrong{color:var(--red);}
  .answer-box{
    display:none;
    background:rgba(255,255,255,0.05);
    border-left:4px solid var(--red);
    border-radius:8px;
    padding:12px 16px;
    margin-top:6px;
  }
  .answer-box.show{display:block;}
  .answer-box .ans-line{
    display:inline;
    font-weight:800;
    margin-right:10px;
  }
  .answer-box .ans-line span{color:var(--red);}
  .answer-box .exp-line{
    display:inline;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .nav-row{
    width:1180px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-top:20px;
    gap:12px;
  }
  .nav-row #prev-btn{justify-self:start;}
  .nav-row #timer-badge{justify-self:center;}
  .nav-row #next-btn{justify-self:end;}
  .nav-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:var(--text);
    padding:12px 22px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:all .18s;
  }
  .nav-btn:hover:not(:disabled){
    background:rgba(56,189,248,0.2);
    border-color:var(--accent);
  }
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .nav-btn.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;
    border:none;
  }
  .molecule-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.15;
    z-index:0;
  }
  #finish-screen{
    display:none;
    text-align:center;
  }
  #finish-screen h2{
    font-size:30px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
  }
  #finish-screen .score{
    font-size:52px;
    font-weight:900;
    margin:16px 0;
  }
  #finish-screen p{color:var(--muted);font-size:16px;}
  .restart-btn{
    margin-top:20px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;border:none;
    padding:14px 30px;border-radius:12px;
    font-weight:800;font-size:16px;cursor:pointer;
  }
/* Phương án dự phòng khi trình duyệt không hỗ trợ Fullscreen API */
body.fallback-fullscreen{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  overflow:auto !important;
  z-index:999999 !important;
  background:#fff !important;
}

/* FULLSCREEN FALLBACK - dùng được khi mở trực tiếp file HTML */
body.fallback-fullscreen{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  z-index:2147483647 !important;
  background:#0f2027 !important;
}
body.fallback-fullscreen #stage{
  /* Giữ nguyên sân khấu 1280x720 và để resizeStage() tính scale như bình thường.
     Tuyệt đối không ghi đè transform bằng !important ở chế độ fullscreen dự phòng. */
  position:fixed !important;
  top:50% !important;
  left:50% !important;
  width:1280px !important;
  height:720px !important;
  min-height:0 !important;
  transform-origin:center center !important;
  overflow:hidden !important;
}

</style>
</head>

<script>
  function isPortrait(){
    return window.innerHeight > window.innerWidth;
  }

  function resizeStage(){
    const stage = document.getElementById('stage');
    if(!stage) return;

    // Giao diện luôn giữ nguyên sân khấu 1280x720 (16:9).
    // Không xoay 90 độ, không phụ thuộc orientation/fullscreen hay cách mở file.
    const scale = Math.min(window.innerWidth/1280, window.innerHeight/720);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }

  function lockLandscape(){
    // Chỉ yêu cầu thiết bị chuyển sang ngang; không dùng CSS rotate nên giao diện vẫn cố định.
    resizeStage();
    try{
      if(screen && screen.orientation && screen.orientation.lock){
        const p = screen.orientation.lock('landscape');
        if(p && typeof p.catch === 'function'){
          p.catch(function(){});
        }
      }
    }catch(e){}
  }

  function unlockLandscape(){
    try{
      if(screen && screen.orientation && screen.orientation.unlock){
        screen.orientation.unlock();
      }
    }catch(e){}
    resizeStage();
  }

  function toggleFullscreen(){
    const body = document.body;
    const doc = document;
    const root = document.documentElement;

    // Đang ở chế độ dự phòng: thóat.
    if(body.classList.contains('fallback-fullscreen')){
      body.classList.remove('fallback-fullscreen');
      unlockLandscape();
      updateFullscreenButton();
      return;
    }

    // Đang ở fullscreen thật: thóat.
    if(doc.fullscreenElement || doc.webkitFullscreenElement){
      try{
        if(doc.exitFullscreen){
          const p = doc.exitFullscreen();
          if(p && typeof p.then === 'function'){
            p.then(function(){
              unlockLandscape();
              updateFullscreenButton();
            }).catch(function(){
              unlockLandscape();
              updateFullscreenButton();
            });
          }else{
            unlockLandscape();
            updateFullscreenButton();
          }
        }else if(doc.webkitExitFullscreen){
          doc.webkitExitFullscreen();
          unlockLandscape();
          updateFullscreenButton();
        }
      }catch(e){
        unlockLandscape();
        updateFullscreenButton();
      }
      return;
    }

    // Bật chế độ yêu cầu xoay ngang ngay từ lúc người dùng bấm nút.
    lockLandscape();

    // Thử fullscreen thật.
    try{
      if(root.requestFullscreen){
        const p = root.requestFullscreen();
        if(p && typeof p.then === 'function'){
          p.then(function(){
            lockLandscape();
            updateFullscreenButton();
          }).catch(function(){
            // Nếu Fullscreen API bị chặn, vẫn giữ phương án xoay ngang bằng CSS.
            body.classList.add('fallback-fullscreen');
            lockLandscape();
            updateFullscreenButton();
          });
        }else{
          lockLandscape();
          updateFullscreenButton();
        }
        return;
      }

      if(root.webkitRequestFullscreen){
        root.webkitRequestFullscreen();
        lockLandscape();
        updateFullscreenButton();
        return;
      }
    }catch(e){}

    // Chế độ dự phòng khi trình duyệt không hỗ trợ Fullscreen API.
    body.classList.add('fallback-fullscreen');
    lockLandscape();
    updateFullscreenButton();
  }

  function updateFullscreenButton(){
    const icon = document.getElementById('fs-icon');
    const label = document.getElementById('fs-label');
    const active = !!(document.fullscreenElement ||
                      document.webkitFullscreenElement ||
                      document.body.classList.contains('fallback-fullscreen'));

    if(icon) icon.textContent = active ? '⤓' : '⛶';
    if(label) label.textContent = active ? 'Thóat toàn màn hình' : 'Toàn màn hình';
  }

  window.addEventListener('resize', resizeStage);
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      unlockLandscape();
    }else{
      lockLandscape();
    }
    resizeStage();
    updateFullscreenButton();
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      unlockLandscape();
    }else{
      lockLandscape();
    }
    resizeStage();
    updateFullscreenButton();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(resizeStage, 120);
  });
  resizeStage();
</script>

{q:"Động năng phân tử phụ thuộc vào", o:["lực liên kết giữa các phân tử.", "thể tích của vật.", "khoảng cách giữa các phân tử.", "tốc độ chuyển động của phân tử."], a:3, e:"Động năng phân tử phụ thuộc vào tốc độ chuyển động của phân tử. Tốc độ chuyển động càng lớn thì động năng phân tử càng lớn."},
{q:"Thế năng mà phân tử có được (gọi là thế năng phân tử) là do", o:["giữa các phân tử chỉ có lực hút.", "các phân tử tương tác với nhau.", "các phân tử chuyển động không ngừng.", "giữa các phân tử không có khoảng cách."], a:1, e:"Do các phân tử tương tác với nhau nên chúng có thế năng. Thế năng này được gọi là thế năng tương tác phân tử, hay thế năng phân tử."},
{q:"Thế năng phân tử phụ thuộc vào", o:["khoảng cách giữa các vật.", "nhiệt độ của vật.", "khoảng cách giữa các phân tử.", "tốc độ chuyển động của phân tử."], a:2, e:"Thế năng phân tử phụ thuộc vào khoảng cách giữa các phân tử. Khi khoảng cách giữa các phân tử thay đổi thì thế năng tương tác phân tử thay đổi."},
{q:"Trong nhiệt động lực học, tổng động năng và thế năng của các phân tử cấu tạo nên vật được gọi là", o:["cơ năng của vật.", "nội năng của vật.", "trọng lượng của vật.", "nhiệt năng của vật."], a:1, e:"Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật. Nội năng được kí hiệu là U và có đơn vị là jun (J)."},
{q:"Nội năng của vật", o:["không phụ thuộc vào nhiệt độ và thể tích của vật.", "không phụ thuộc vào nhiệt độ của vật, chỉ phụ thuộc vào thể tích của vật.", "không phụ thuộc vào thể tích của vật, chỉ phụ thuộc vào nhiệt độ của vật.", "phụ thuộc vào nhiệt độ và thể tích của vật."], a:3, e:"Nội năng của vật phụ thuộc vào nhiệt độ và thể tích của vật. Nhiệt độ ảnh hưởng đến động năng phân tử, còn thể tích ảnh hưởng đến khoảng cách và thế năng tương tác giữa các phân tử."},
{q:"Khi nói về nội năng của vật, phát biểu nào sau đây sai?", o:["Các phân tử cấu tạo nên vật chuyển động nhiệt không ngừng nên chúng có động năng.", "Động năng của các phân tử cấu tạo nên vật phụ thuộc vào tốc độ của chúng.", "Do giữa các phân tử cấu tạo nên vật có lực tương tác nên giữa các vật có thế năng tương tác phân tử.", "Thế năng tương tác giữa các phân tử cấu tạo nên vật phụ thuộc vào khoảng cách giữa các phân tử."], a:2, e:"Nội năng liên quan đến động năng của các phân tử cấu tạo nên vật và thế năng tương tác giữa các phân tử đó. Vì giữa các phân tử có lực tương tác nên giữa các phân tử có thế năng tương tác; không phải là thế năng tương tác giữa các vật."},
{q:"Phát biểu nào sau đây sai khi nói về nội năng?", o:["Mọi vật đều có nội năng.", "Nội năng là một dạng năng lượng.", "Nội năng bằng tổng động năng và thế năng của các vật.", "Nội năng được kí hiệu bằng chữ U và có đơn vị là jun (J)."], a:2, e:"Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật. Mọi vật đều có nội năng; nội năng là một dạng năng lượng, được kí hiệu là U và có đơn vị là jun (J)."},
{q:"Khi nhiệt độ của vật thay đổi thì", o:["khối lượng của các phân tử cấu tạo nên vật thay đổi.", "tốc độ của các phân tử cấu tạo nên vật không thay đổi.", "động năng của các phân tử cấu tạo nên vật thay đổi.", "thế năng của các phân tử cấu tạo nên vật thay đổi."], a:2, e:"Khi nhiệt độ thay đổi, tốc độ chuyển động nhiệt của các phân tử thay đổi. Vì động năng phân tử phụ thuộc vào tốc độ chuyển động nên động năng phân tử thay đổi."},
{q:"Khi thể tích của vật thay đổi thì", o:["khối lượng của các phân tử cấu tạo nên vật thay đổi.", "tốc độ của các phân tử cấu tạo nên vật thay đổi.", "động năng của các phân tử cấu tạo nên vật thay đổi.", "thế năng của các phân tử cấu tạo nên vật thay đổi."], a:3, e:"Khi thể tích thay đổi, khoảng cách giữa các phân tử thay đổi. Vì thế năng phân tử phụ thuộc vào khoảng cách giữa các phân tử nên thế năng phân tử thay đổi."},
{q:"Các dụng cụ nào sau đây được sử dụng trong thí nghiệm về mối liên hệ nội năng của vật với năng lượng của các phân tử cấu tạo nên vật?", o:["Ống nghiệm, nhiệt kế để đo nhiệt độ, đèn cồn, giá đỡ thí nghiệm.", "Nút bấc để đậy miệng ống nghiệm, đèn cồn, giá đỡ thí nghiệm, không khí.", "Giá đỡ thí nghiệm, ống nghiệm, nút bấc để đậy miệng ống nghiệm, nhiệt kế.", "Giá đỡ thí nghiệm, ống nghiệm, nút bấc để đậy miệng ống nghiệm, đèn cồn."], a:3, e:"Thí nghiệm cần ống nghiệm, nút bấc, đèn cồn và giá đỡ thí nghiệm."},
{q:"Trong thí nghiệm về mối liên hệ nội năng của vật với năng lượng của các phân tử cấu tạo nên vật, khi nút bấc chưa bị bật ra, nội năng của không khí trong ống nghiệm tăng là vì", o:["thế năng phân tử khí tăng.", "không khí nhận nhiệt từ đèn cồn.", "không khí truyền nhiệt cho nút bấc.", "khoảng cách giữa các phân tử khí tăng."], a:1, e:"Khi hơ nóng, không khí trong ống nghiệm nhận nhiệt từ đèn cồn nên nội năng của không khí tăng."},
{q:"Trong thí nghiệm về mối liên hệ nội năng của vật với năng lượng của các phân tử cấu tạo nên vật, nút bấc bị bật ra chứng tỏ điều gì?", o:["Thế năng của các phân tử khí tăng.", "Động năng của các phân tử khí tăng.", "Lực do không khí tác dụng vào nút bấc yếu hơn.", "Động năng của các phân tử khí giảm."], a:1, e:"Khi đun, nhiệt độ của khí tăng nên các phân tử chuyển động nhanh hơn, động năng phân tử tăng. Các phân tử tác dụng lực lên nút bấc mạnh hơn; khi đủ lớn, nút bấc bị bật ra."},
{q:"Khi hơ một ống nghiệm chứa không khí có nút bấc đậy vừa kín trên ngọn lửa đèn cồn. Sau thời gian ngắn bị đốt nóng, chiếc nút bấc bị đẩy bật ra khỏi ống nghiệm vì", o:["áp suất của không khí giảm xuống.", "nội năng của không khí tăng lên.", "động năng của các phân tử không khí giảm dần.", "tốc độ chuyển động của các phân tử khí không đổi."], a:1, e:"Khi hơ nóng, nhiệt độ của khí tăng, các phân tử chuyển động nhanh hơn và nội năng của khí tăng."},
{q:"Hai cách làm thay đổi nội năng của vật là", o:["thực hiện công và truyền nhiệt.", "thực hiện công và truyền động năng.", "thay đổi vị trí và truyền nhiệt.", "thay đổi hình dạng và truyền thế năng."], a:0, e:"Có hai cách làm thay đổi nội năng: thực hiện công và truyền năng lượng nhiệt, gọi tắt là truyền nhiệt."},
{q:"Cục nước đá đang tan, nội năng của nó biến đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:1, e:"Khi nước đá đang tan, nhiệt độ không đổi nên động năng phân tử không đổi. Chất chuyển từ rắn sang lỏng làm thế năng phân tử tăng, vì vậy nội năng tăng."},
{q:"Vật rắn đang nóng chảy, nội năng của nó biến đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:1, e:"Khi vật rắn nóng chảy, nhiệt độ không đổi nên động năng phân tử không đổi. Chuyển từ rắn sang lỏng làm thế năng phân tử tăng, nên nội năng tăng."},
{q:"Hơi nước ngưng tụ ở nhiệt độ không đổi, nội năng của nó biến đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:0, e:"Khi hơi nước ngưng tụ ở nhiệt độ không đổi, động năng phân tử không đổi. Chuyển từ khí sang lỏng làm thế năng phân tử giảm, nên nội năng giảm."},
{q:"Trường hợp nào sau đây không làm thay đổi nội năng của miếng đồng?", o:["Cọ xát miếng đồng lên mặt bàn.", "Đốt nóng miếng đồng.", "Đưa miếng đồng lên một độ cao nhỏ so với mặt đất.", "Làm lạnh miếng đồng."], a:2, e:"Đưa miếng đồng lên cao không làm thay đổi nội năng của miếng đồng."},
{q:"Trường hợp nào dưới đây làm biến đổi nội năng của vật không phải do thực hiện công?", o:["Mài dao.", "Đóng đinh.", "Nung đồng trong lò.", "Khuấy nước."], a:2, e:"Nung đồng trong lò làm thay đổi nội năng bằng cách truyền nhiệt, không phải do thực hiện công. Các trường hợp mài dao, đóng đinh và khuấy nước đều là những ví dụ về thực hiện công làm thay đổi nội năng."},
{q:"Theo định luật I của nhiệt động lực học, độ biến thiên nội năng của vật bằng", o:["tổng công và nhiệt lượng mà vật nhận được.", "tổng công và động năng mà vật nhận được.", "độ biến thiên nhiệt độ của vật.", "phần năng lượng của vật bị mất do ma sát."], a:0, e:"Định luật I của nhiệt động lực học cho biết độ biến thiên nội năng bằng tổng công và nhiệt lượng mà vật nhận được: ΔU = A + Q."},
{q:"Nội năng của một vật là", o:["tổng động năng và thế năng của các phân tử cấu tạo nên vật.", "tổng động năng và thế năng của vật.", "tổng nhiệt lượng và cơ năng mà vật nhận được.", "nhiệt lượng vật nhận được trong quá trình truyền nhiệt."], a:0, e:"Nội năng là tổng động năng và thế năng của các phân tử cấu tạo nên vật. Không phải tổng động năng và thế năng của cả vật."},
{q:"Phát biểu nào sau đây sai khi nói về nhiệt lượng?", o:["Đơn vị của nhiệt lượng cũng là đơn vị của nội năng.", "Nhiệt lượng là số đo nhiệt năng được truyền từ vật này sang vật khác trong quá trình truyền nhiệt.", "Một vật lúc nào cũng có nội năng, do đó lúc nào cũng có nhiệt lượng.", "Nhiệt lượng chỉ tồn tại trong quá trình truyền nhiệt."], a:2, e:"Nhiệt lượng chỉ xuất hiện trong quá trình truyền nhiệt. Một vật luôn có nội năng nhưng không phải lúc nào cũng có nhiệt lượng."},
{q:"Nội năng của một vật là", o:["tổng động năng và thế năng của các phân tử cấu tạo nên vật.", "tổng động năng và thế năng mà vật nhận được trong quá trình truyền nhiệt.", "tổng công và nhiệt lượng mà vật nhận được.", "tổng động năng và thế năng tương tác của các vật."], a:0, e:"Nội năng được xác định bằng tổng động năng và thế năng của các phân tử cấu tạo nên vật. Các đại lượng A và Q liên quan đến quá trình làm biến đổi nội năng, không phải là định nghĩa của nội năng."},
{q:"Một lượng khí có thể tích không đổi. Khi nhiệt độ của nó tăng lên thì", o:["nội năng của khí tăng vì thế năng tương tác phân tử của chất khí tăng.", "nội năng của khí giảm vì động năng của các phân tử cấu tạo nên vật giảm.", "nội năng của khí giảm vì thế năng tương tác phân tử của chất khí giảm.", "nội năng của khí tăng vì động năng của các phân tử cấu tạo nên vật tăng."], a:3, e:"Ở thể tích không đổi, khi nhiệt độ tăng thì các phân tử chuyển động nhanh hơn, động năng phân tử tăng. Do đó nội năng tăng chủ yếu do động năng phân tử tăng."},
{q:"Phát biểu nào sau đây đúng khi nói về nội năng?", o:["Khi năng lượng của các phân tử cấu tạo nên vật giảm thì nội năng của vật tăng và ngược lại.", "Khi thể tích của vật tăng thì khoảng cách giữa các phân tử cấu tạo nên vật giảm, nên nội năng của vật giảm.", "Khi nhiệt độ của vật tăng thì các phân tử cấu tạo nên vật chuyển động nhanh hơn, nên nội năng của vật tăng.", "Khi nhiệt độ của vật tăng thì các phân tử cấu tạo nên vật chuyển động chậm hơn, nên nội năng của vật giảm."], a:2, e:"Khi nhiệt độ tăng, các phân tử chuyển động nhanh hơn nên động năng phân tử tăng, làm nội năng tăng."},
{q:"Phát biểu nào sau đây đúng để giải thích nội năng của vật phụ thuộc vào nhiệt độ của vật? Biết thể tích của vật được giữ không đổi.", o:["Khi nhiệt độ tăng, khoảng cách giữa các phân tử cấu tạo nên vật giảm dần làm động năng của chúng giảm dần.", "Khi nhiệt độ giảm, nội năng của vật tăng vì các phân tử vật chất cấu tạo nên vật chuyển động nhanh dần.", "Khi nhiệt độ giảm, khoảng cách giữa các phân tử cấu tạo nên vật tăng dần làm động năng của chúng tăng dần.", "Khi nhiệt độ tăng, nội năng của vật tăng vì tốc độ chuyển động của các phân tử vật chất cấu tạo nên vật tăng."], a:3, e:"Nội năng phụ thuộc vào nhiệt độ vì khi nhiệt độ tăng, tốc độ chuyển động của các phân tử tăng, làm động năng phân tử tăng và do đó nội năng tăng."},
{q:"Một lượng khí có thể tích không đổi. Khi nhiệt độ của nó giảm xuống thì", o:["nội năng của khí giảm vì thế năng tương tác phân tử của chất khí giảm.", "nội năng của khí tăng vì động năng của các phân tử cấu tạo nên vật giảm.", "nội năng của khí giảm vì động năng của các phân tử cấu tạo nên vật giảm.", "nội năng của khí giảm vì thế năng tương tác phân tử của chất khí tăng."], a:2, e:"Ở thể tích không đổi, khi nhiệt độ giảm, các phân tử chuyển động chậm hơn nên động năng phân tử giảm. Vì vậy nội năng của khí giảm."},
{q:"Độ biến thiên nội năng của vật bằng", o:["tổng động năng và thế năng mà vật nhận được trong quá trình truyền nhiệt.", "tổng động năng và thế năng tương tác của các vật.", "tổng công và nhiệt lượng mà vật nhận được.", "tổng động năng và thế năng của các phân tử cấu tạo nên vật."], a:2, e:"Độ biến thiên nội năng theo định luật I được xác định bởi tổng công và nhiệt lượng mà vật nhận được: ΔU = A + Q."},
{q:"Khi nhiệt độ của vật tăng lên thì", o:["động năng của các phân tử cấu tạo nên vật giảm.", "nội năng của vật giảm.", "động năng của các phân tử cấu tạo nên vật tăng.", "thế năng của các phân tử cấu tạo nên vật tăng."], a:2, e:"Khi nhiệt độ tăng, các phân tử chuyển động nhanh hơn nên động năng phân tử tăng."},
{q:"Phát biểu nào sau đây đúng khi nói về nội năng?", o:["Nội năng là nhiệt lượng.", "Nội năng là một dạng năng lượng.", "Nội năng của vật A lớn hơn nội năng của vật B thì nhiệt độ của vật A cũng lớn hơn nhiệt độ của vật B.", "Nội năng của vật chỉ thay đổi trong quá trình truyền nhiệt, không thay đổi trong quá trình thực hiện công."], a:1, e:"Nội năng là một dạng năng lượng, nhưng không đồng nhất với nhiệt lượng."},
{q:"Phát biểu nào sau đây đúng khi nói về nội năng?", o:["Độ biến thiên nội năng của một vật là độ biến thiên nhiệt độ của vật đó.", "Nội năng gọi là nhiệt lượng.", "Nội năng là phần năng lượng vật nhận được hay mất bớt đi trong quá trình truyền nhiệt.", "Có thể làm thay đổi nội năng của vật bằng cách thực hiện công."], a:3, e:"Nội năng có thể được làm thay đổi bằng cách thực hiện công. Ví dụ, thực hiện công lên vật có thể làm nội năng của vật thay đổi."},
{q:"Phát biểu nào sau đây không đúng khi nói về nội năng?", o:["Nội năng là một dạng năng lượng.", "Nội năng không phải là nhiệt lượng.", "Nội năng có thể chuyển hóa thành các dạng năng lượng khác.", "Số đo nhiệt năng được truyền từ vật này sang vật khác trong quá trình truyền nhiệt gọi là nội năng."], a:3, e:"Nhiệt lượng là số đo nhiệt năng được truyền từ vật này sang vật khác trong quá trình truyền nhiệt, còn nội năng là tổng động năng và thế năng của các phân tử cấu tạo nên vật."},
{q:"Phát biểu nào sau đây sai? Để làm thay đổi nội năng của một vật, ta", o:["cung cấp nhiệt lượng cho vật.", "thực hiện công nhấc vật lên theo phương vuông góc với mặt đất một đoạn 1 m.", "cho vật trượt từ độ cao 1 m xuống mặt đất bằng mặt phẳng nghiêng với góc nghiêng 60° so với mặt đất.", "cho vật truyền nhiệt lượng sang một vật khác có nhiệt độ thấp hơn."], a:1, e:"Thực hiện công nhấc vật lên cao không làm thay đổi nội năng của vật."},
{q:"Phát biểu nào sau đây sai khi nói về việc làm thay đổi nội năng của vật bằng cách thực hiện công?", o:["Quá trình thực hiện công làm cho nội năng của vật thay đổi.", "Vật nhận công thì nội năng tăng, vật thực hiện công cho vật khác thì nội năng giảm.", "Trong quá trình thực hiện công, có sự chuyển hóa từ động năng phân tử sang nội năng.", "Lấy búa đập dẹp thanh nhôm làm thanh nhôm nóng lên là một ví dụ về thực hiện công."], a:2, e:"Khi thực hiện công, có sự chuyển hóa từ cơ năng sang nội năng; không diễn đạt là chuyển hóa từ động năng phân tử sang nội năng."},
{q:"Làm nóng khối khí bên trong ống nghiệm bằng cách hơ ống nghiệm trên ngọn lửa đèn cồn. Khi đó, nội năng của khối khí trong ống nghiệm tăng. Phát biểu nào sau đây sai?", o:["Cách làm thay đổi nội năng của khối khí như trên gọi là truyền nhiệt.", "Khối khí đã nhận nhiệt từ bên ngoài.", "Phần năng lượng của ngọn lửa truyền cho khối khí gọi là nhiệt lượng.", "Trong quá trình truyền nhiệt, cơ năng đã chuyển hóa thành nội năng."], a:3, e:"Hơ nóng khối khí là truyền nhiệt: khối khí nhận nhiệt từ bên ngoài, phần năng lượng truyền cho khí gọi là nhiệt lượng."},
{q:"Phát biểu nào sau đây không đúng khi nói về truyền nhiệt và thực hiện công?", o:["Thực hiện công là quá trình có thể làm thay đổi nội năng của vật.", "Trong thực hiện công có sự chuyển hóa từ cơ năng thành nội năng.", "Trong truyền nhiệt có sự truyền động năng từ phân tử này sang phân tử khác.", "Trong truyền nhiệt có sự chuyển hóa từ cơ năng sang nội năng."], a:3, e:"Trong truyền nhiệt có sự truyền năng lượng nhiệt từ vật này sang vật khác; không phải là sự chuyển hóa cơ năng sang nội năng."},
{q:"Gọi ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Phát biểu nào sau đây đúng khi nói về định luật I của nhiệt động lực học?", o:["Độ biến thiên nội năng của vật bằng tổng công và nhiệt lượng mà vật nhận được.", "Công mà vật nhận được bằng tổng độ biến thiên nội năng và nhiệt lượng mà vật nhận được.", "Biểu thức mô tả định luật I của nhiệt động lực học là Q = ΔU + A.", "Nếu vật đồng thời nhận nhiệt và thực hiện công thì đều làm tăng nội năng của vật."], a:0, e:"Định luật I của nhiệt động lực học có biểu thức ΔU = A + Q."},
{q:"Gọi ΔU là độ biến thiên nội năng của vật; U là nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Biểu thức nào sau đây mô tả định luật I của nhiệt động lực học?", o:["U = A + Q.", "U = A – Q.", "ΔU = A + Q.", "ΔU = A - Q."], a:2, e:"Định luật I của nhiệt động lực học có biểu thức ΔU = A + Q, trong đó A và Q là công và nhiệt lượng mà vật nhận được."},
{q:"Gọi ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Định luật I của nhiệt động lực học được biểu diễn bằng công thức ΔU = A + Q. Quy ước về dấu của A, Q và ΔU nào sau đây đúng?", o:["A > 0: Vật thực hiện công lên vật khác.", "Q < 0: Vật nhận nhiệt lượng từ vật khác.", "A > 0: Vật nhận công từ vật khác.", "ΔU > 0: Nội năng của vật giảm."], a:2, e:"Với quy ước của SGK, A > 0 khi vật nhận công từ vật khác."},
{q:"Gọi ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Định luật I của nhiệt động lực học được biểu diễn bằng công thức ΔU = A + Q. Quy ước về dấu của A, Q và ΔU nào sau đây đúng?", o:["A > 0: Vật thực hiện công lên vật khác.", "Q < 0: Vật nhận nhiệt lượng từ vật khác.", "A < 0: Vật nhận công từ vật khác.", "ΔU > 0: Nội năng của vật tăng."], a:3, e:"Với quy ước của SGK, ΔU > 0 nghĩa là nội năng của vật tăng."},
{q:"Hệ thức ΔU = A + Q với A > 0, Q < 0 diễn tả cho quá trình nào của chất khí?", o:["Nhận công và truyền nhiệt lượng.", "Nhận nhiệt và sinh công.", "Truyền nhiệt lượng và nội năng giảm.", "Nhận công và nội năng giảm."], a:0, e:"A > 0 nghĩa là vật nhận công; Q < 0 nghĩa là vật truyền nhiệt lượng cho vật khác."},
{q:"Trong quá trình chất khí truyền nhiệt lượng và nhận công thì A và Q trong biểu thức ΔU = A + Q phải có giá trị nào sau đây?", o:["Q < 0, A > 0.", "Q < 0, A < 0.", "Q > 0, A > 0.", "Q > 0, A < 0."], a:0, e:"Chất khí truyền nhiệt lượng nên Q < 0; đồng thời nhận công nên A > 0."},
{q:"Trong quá trình chất khí nhận nhiệt lượng và sinh công thì A và Q trong biểu thức ΔU = A + Q phải có giá trị nào sau đây?", o:["Q < 0, A > 0.", "Q > 0, A < 0.", "Q > 0, A > 0.", "Q < 0, A < 0."], a:1, e:"Chất khí nhận nhiệt nên Q > 0; sinh công nghĩa là vật thực hiện công lên vật khác nên A < 0."},
{q:"Hệ thức nào dưới đây là phù hợp với quá trình một khối khí trong bình kín có thể tích không đổi bị nung nóng?", o:["ΔU = A; A > 0.", "ΔU = Q; Q > 0.", "ΔU = A; A < 0.", "ΔU = Q; Q < 0."], a:1, e:"Khi thể tích không đổi, khí không thực hiện công nên A = 0. Khi nung nóng, khí nhận nhiệt nên Q > 0. Do đó ΔU = Q và Q > 0."},
{q:"Hệ thức nào sau đây phù hợp với quá trình khối khí được làm lạnh và giữ nguyên thể tích?", o:["ΔU = A, A > 0.", "ΔU = Q, Q > 0.", "ΔU = A, A < 0.", "ΔU = Q, Q < 0."], a:3, e:"Khi khí được làm lạnh (tức là khí tỏa nhiệt) nên Q < 0. Vì thể tích không đổi nên A = 0. Theo ΔU = A + Q, ta có ΔU = Q < 0."},
{q:"Hệ thức nào dưới đây là phù hợp với quá trình một khối khí trong bình kín có thể tích không đổi bị làm lạnh?", o:["ΔU = A; A > 0.", "ΔU = Q; Q > 0.", "ΔU = A; A < 0.", "ΔU = Q; Q < 0."], a:3, e:"Quá trình làm lạnh ở thể tích không đổi vẫn có A = 0 và khí tỏa nhiệt nên Q < 0. Vì vậy ΔU = Q, Q < 0."},
{q:"Nội năng của một khối khí xác định không đổi khi", o:["nhiệt độ của khối khí thay đổi.", "nhiệt độ và thể tích của khối khí không đổi.", "thể tích của khối khí không đổi.", "khối khí nhận năng lượng nhiệt từ vật khác."], a:1, e:"Nội năng của một lượng khí xác định không đổi khi cả nhiệt độ và thể tích không đổi. Đây là điều kiện phù hợp với sự phụ thuộc của nội năng vào nhiệt độ và thể tích.", sourceLabel:"TN 2025"},
{q:"Công thức định luật I của nhiệt động lực học là ΔU = A + Q, với A là kí hiệu công và Q là kí hiệu", o:["nhiệt dung riêng.", "nhiệt nóng chảy riêng.", "nhiệt lượng.", "nhiệt độ."], a:2, e:"Trong công thức ΔU = A + Q, Q kí hiệu nhiệt lượng.", sourceLabel:"TN 2025"},
{q:"Công thức định luật I của nhiệt động lực học là ΔU = A + Q, với Q là kí hiệu nhiệt lượng và A là kí hiệu", o:["công.", "nhiệt dung riêng.", "nội năng.", "nhiệt độ."], a:0, e:"Trong công thức ΔU = A + Q, A kí hiệu công.", sourceLabel:"TN 2025"},
{q:"Nén một khối khí lí tưởng trong xilanh kín. Nội năng của khối khí", o:["giảm do khối khí nhận công.", "tăng do khối khí nhận công.", "tăng, nếu xilanh cách nhiệt.", "không đổi, nếu xilanh cách nhiệt."], a:2, e:"Khi nén khí, khí nhận công nên A > 0. Nếu xilanh cách nhiệt thì Q = 0. Theo ΔU = A + Q, nội năng của khối khí tăng.", sourceLabel:"TN 2026 lần 1"},
{q:"Làm lạnh một lượng khí lí tưởng trong bình kín có thể tích không đổi. Nội năng của lượng khí", o:["không đổi vì thể tích khí không đổi.", "tăng do nhận công.", "giảm do sinh công.", "giảm do tỏa nhiệt lượng."], a:3, e:"Khi làm lạnh khí trong bình kín có thể tích không đổi, khí tỏa nhiệt nên Q < 0 và A = 0. Do đó ΔU < 0: nội năng giảm.", sourceLabel:"TN 2026 lần 2"},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = Q và Q > 0 thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Giảm rồi tăng."], a:1, e:"Nếu ΔU = Q và Q > 0 thì ΔU > 0. Độ biến thiên nội năng dương nghĩa là nội năng tăng."},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = Q và Q < 0 thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:0, e:"Nếu ΔU = Q và Q < 0 thì ΔU < 0. Vì vậy nội năng giảm."},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = A và A > 0 thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Giảm rồi tăng."], a:1, e:"Nếu ΔU = A và A > 0 thì ΔU > 0. Vật nhận công nên nội năng tăng."},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = A và A < 0 thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:0, e:"Nếu ΔU = A và A < 0 thì ΔU < 0. Vật thực hiện công lên vật khác nên nội năng giảm."},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = A + Q và A > 0, Q > 0 thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Giảm rồi tăng."], a:1, e:"Khi A > 0 và Q > 0, cả công và nhiệt lượng đều truyền năng lượng vào vật. Vì vậy ΔU = A + Q > 0, nội năng tăng."},
{q:"Theo công thức định luật I của nhiệt động lực học là ΔU = A + Q, trong đó ΔU là độ biến thiên nội năng của vật; A, Q là công và nhiệt lượng mà vật nhận được. Nếu ΔU = A + Q và A < 0, Q > 0, |A| > Q thì nội năng của vật thay đổi như thế nào?", o:["Giảm.", "Tăng.", "Không thay đổi.", "Tăng rồi giảm."], a:0, e:"Với A < 0, Q > 0 và |A| > Q thì tổng A + Q < 0. Do đó ΔU < 0, nội năng giảm."},
{q:"Người ta thực hiện công bằng 100 J để nén khí trong một xilanh. Biết khí truyền ra môi trường xung quanh một nhiệt lượng bằng 20 J. Độ biến thiên nội năng của khí là", o:["80 J.", "120 J.", "-80 J.", "-120 J."], a:0, e:"Khí nhận công 100 J nên A = +100 J; khí truyền nhiệt 20 J nên Q = −20 J. Theo ΔU = A + Q, ΔU = 100 − 20 = 80 J."},
{q:"Người ta truyền cho khí trong xilanh một nhiệt lượng bằng 100 J, khí nở ra và sinh ra một công bằng 70 J đẩy pit-tông chuyển động. Độ biến thiên nội năng của khí là", o:["30 J.", "170 J.", "100 J.", "-30 J."], a:0, e:"Khí nhận nhiệt 100 J nên Q = +100 J; khí nở và thực hiện công 70 J nên A = −70 J. Do đó ΔU = 100 − 70 = 30 J."},
{q:"Nội năng của khí tăng lên 15 J khi truyền cho khí một nhiệt lượng bằng 35 J. Khi đó, khối khí đã", o:["thực hiện công bằng 40 J.", "nhận công bằng 20 J.", "thực hiện công bằng 20 J.", "nhận công bằng 40 J."], a:2, e:"Ta có ΔU = 15 J, Q = 35 J. Theo ΔU = A + Q: 15 = A + 35 nên A = −20 J. Dấu âm cho biết khí thực hiện công 20 J."},
{q:"Nếu thực hiện công bằng 100 J để nén khí trong xilanh và khí truyền ra môi trường xung quanh một nhiệt lượng bằng 20 J thì nội năng của khí", o:["tăng 80 J.", "tăng 120 J.", "giảm 80 J.", "giảm 120 J."], a:0, e:"Khí nhận công 100 J nên A = +100 J; truyền nhiệt 20 J nên Q = −20 J. Suy ra ΔU = 80 J, tức nội năng tăng 80 J."},
{q:"Khí trong xilanh nhận nhiệt lượng hay truyền nhiệt lượng một lượng bằng bao nhiêu nếu như thực hiện công bằng 40 J lên khí và nội năng của khí tăng thêm 20 J?", o:["Khí truyền nhiệt lượng bằng 20 J.", "Khí nhận nhiệt lượng bằng 20 J.", "Khí truyền nhiệt lượng bằng 40 J.", "Khí nhận nhiệt lượng bằng 40 J."], a:0, e:"Khí nhận công 40 J nên A = +40 J và ΔU = +20 J. Từ 20 = 40 + Q suy ra Q = −20 J. Dấu âm nghĩa là khí truyền nhiệt lượng 20 J ra môi trường."},
{q:"Một lượng khí được truyền một nhiệt lượng bằng 250 kJ do đun nóng nó và đồng thời nhận công bằng 150 kJ do nó bị nén. Trong quá trình đó nội năng của lượng khí", o:["giảm bớt một lượng 400 kJ.", "tăng thêm một lượng 100 kJ.", "giảm bớt một lượng 100 kJ.", "tăng thêm một lượng 400 kJ."], a:3, e:"Khí nhận nhiệt 250 kJ nên Q = +250 kJ và nhận công 150 kJ nên A = +150 kJ. Vì ΔU = A + Q = 400 kJ nên nội năng tăng thêm 400 kJ."},
];

const letters = ["A","B","C","D"];

/* ---------- Xáo trộn thứ tự câu hỏi và thứ tự đáp án mỗi lượt làm bài ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildShuffledQuestions(){
  const shuffledOrder = shuffleArray(questions);
  return shuffledOrder.map(q => {
    const optionOrder = shuffleArray([0,1,2,3]); // vị trí gốc của từng phương án sau khi xáo
    const newOptions = optionOrder.map(origIdx => q.o[origIdx]);
    const newCorrect = optionOrder.indexOf(q.a);
    return { q: q.q, o: newOptions, a: newCorrect, e: q.e, sourceLabel: q.sourceLabel || "" };
  });
}
let activeQuestions = buildShuffledQuestions();

let current = 0;
let answered = new Array(activeQuestions.length).fill(false);
let correctCount = 0;
const TIME_LIMIT = 50;
let timeLeft = TIME_LIMIT;
let timerInterval = null;

/* ---------- Âm thanh (tổng hợp trực tiếp, không cần file, chạy offline) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, duration, type, vol, delay){
  try{
    const ctx = getAudioCtx();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(vol||0.3, startAt);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.02);
  }catch(e){ /* trình duyệt chặn audio trước tương tác - bỏ qua an toàn */ }
}
function playCorrectSound(){
  playTone(784, 0.13, "sine", 0.28, 0);
  playTone(988, 0.13, "sine", 0.28, 0.11);
  playTone(1318, 0.22, "sine", 0.3, 0.22);
}
function playWrongSound(){
  playTone(220, 0.28, "sawtooth", 0.22, 0);
  playTone(160, 0.32, "sawtooth", 0.2, 0.1);
}
function playTimeUpSound(){
  playTone(300, 0.15, "square", 0.2, 0);
  playTone(220, 0.15, "square", 0.2, 0.16);
  playTone(140, 0.3, "square", 0.22, 0.32);
}

/* ---------- Đồng hồ đếm ngược 10 giây mỗi câu ---------- */
const timerBadgeEl = document.getElementById("timer-badge");
const timerTextEl = document.getElementById("timer-text");

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay(){
  timerTextEl.textContent = timeLeft;
  timerBadgeEl.classList.remove("warn","danger","stopped");
  if(timeLeft<=3 && timeLeft>0){ timerBadgeEl.classList.add("danger"); }
  else if(timeLeft<=6){ timerBadgeEl.classList.add("warn"); }
}
function startTimer(){
  stopTimer();
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      timeLeft = 0;
      updateTimerDisplay();
      stopTimer();
      handleTimeUp();
    } else {
      updateTimerDisplay();
    }
  },1000);
}
function freezeTimerDisplay(){
  stopTimer();
  timerBadgeEl.classList.add("stopped");
}
function handleTimeUp(){
  if(answered[current]) return;
  playTimeUpSound();
  const q = activeQuestions[current];
  const btns = optionsEl.querySelectorAll(".opt-btn");
  btns.forEach(b=>b.classList.add("disabled"));
  feedbackEl.textContent = "⏰ HẾT GIỜ!";
  feedbackEl.className = "feedback wrong";
  answered[current] = true;
  revealAnswer(true);
  timerBadgeEl.classList.add("stopped");

  // Hết thời gian dù chưa chọn đáp án vẫn được sang câu tiếp theo.
  nextBtn.disabled = false;
  nextBtn.style.opacity = "";
  nextBtn.style.cursor = "pointer";
  nextBtn.textContent = (current === activeQuestions.length - 1)
    ? "HOÀN THÀNH"
    : "CÂU TIẾP THEO →";
}

const qnumEl = document.getElementById("qnum");
const qtextEl = document.getElementById("qtext");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const answerBoxEl = document.getElementById("answer-box");
const ansLetterEl = document.getElementById("ans-letter");
const expTextEl = document.getElementById("exp-text");
const progressTextEl = document.getElementById("progress-text");
const progressFillEl = document.getElementById("progress-fill");
const scoreTextEl = document.getElementById("score-text");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
const quizCard = document.getElementById("quiz-card");
const finishScreen = document.getElementById("finish-screen");
const navRow = document.getElementById("nav-row");
const progressWrap = document.getElementById("progress-wrap");

function formatScore(count){
  const score = count * 0.15625;
  return score.toFixed(2).replace(".", ",");
}

function renderSlide(){
  const q = activeQuestions[current];
  qnumEl.textContent = "CÂU " + String(current+1).padStart(2,"0") + (q.sourceLabel ? " (" + q.sourceLabel + ")" : "");
  qtextEl.textContent = q.q;
  progressTextEl.textContent = "CÂU " + String(current+1).padStart(2,"0") + " / " + activeQuestions.length;
  progressFillEl.style.width = ((current+1)/activeQuestions.length*100) + "%";
  scoreTextEl.textContent = "Điểm: " + formatScore(correctCount);

  optionsEl.innerHTML = "";
  q.o.forEach((optText, idx)=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = '<span class="badge">'+letters[idx]+'</span><span>'+optText+'</span>';
    btn.onclick = ()=>selectAnswer(idx);
    optionsEl.appendChild(btn);
  });

  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  answerBoxEl.className = "answer-box";

  if(answered[current]){
    revealAnswer(true);
    freezeTimerDisplay();
  } else {
    startTimer();
  }

  prevBtn.disabled = (current===0);
  nextBtn.textContent = (current===activeQuestions.length-1) ? "HOÀN THÀNH" : "CÂU TIẾP THEO →";
  nextBtn.disabled = !answered[current];
  nextBtn.style.opacity = answered[current] ? "" : "0.45";
  nextBtn.style.cursor = answered[current] ? "pointer" : "not-allowed";
}

function selectAnswer(idx){
  if(answered[current]) return; // đã trả lời rồi, khóa không cho chọn lại
  const q = activeQuestions[current];
  const btns = optionsEl.querySelectorAll(".opt-btn");
  answered[current] = true;
  freezeTimerDisplay();
  if(idx === q.a){
    playCorrectSound();
    btns[idx].classList.add("correct");
    feedbackEl.textContent = "✓ CHÍNH XÁC!";
    feedbackEl.className = "feedback correct";
    correctCount++;
    scoreTextEl.textContent = "Điểm: " + formatScore(correctCount);
  } else {
    playWrongSound();
    btns[idx].classList.add("wrong");
    feedbackEl.textContent = "✗ CHƯA ĐÚNG!";
    feedbackEl.className = "feedback wrong";
  }
  btns.forEach(b=>b.classList.add("disabled"));
  revealAnswer(false);
  nextBtn.disabled = false;
  nextBtn.style.opacity = "";
  nextBtn.style.cursor = "pointer";
}

function revealAnswer(instant){
  const q = activeQuestions[current];
  ansLetterEl.textContent = letters[q.a];
  expTextEl.textContent = "GIẢI THÍCH: " + q.e;
  answerBoxEl.classList.add("show");
  const btns = optionsEl.querySelectorAll(".opt-btn");
  btns[q.a].classList.add("correct");
  btns.forEach(b=>b.classList.add("disabled"));
}

function nextSlide(){
  // Nếu hết giờ mà học sinh chưa chọn đáp án, vẫn được sang câu tiếp theo.
  if(!answered[current] && timeLeft > 0){
    alert("Hãy chọn một đáp án trước khi sang câu tiếp theo.");
    return;
  }
  if(current === activeQuestions.length-1){
    showFinish();
    return;
  }
  current++;
  renderSlide();
}

function prevSlide(){
  if(current===0) return;
  current--;
  renderSlide();
}

function showFinish(){
  stopTimer();
  quizCard.style.display = "none";
  navRow.style.display = "none";
  progressWrap.style.display = "none";
  finishScreen.style.display = "block";
  document.getElementById("final-score").textContent = "Điểm: " + formatScore(correctCount);
}

function restartQuiz(){
  stopTimer();
  activeQuestions = buildShuffledQuestions();
  current = 0;
  answered = new Array(activeQuestions.length).fill(false);
  correctCount = 0;
  quizCard.style.display = "block";
  navRow.style.display = "grid";
  progressWrap.style.display = "block";
  finishScreen.style.display = "none";
  renderSlide();
}

renderSlide();

</script>
</body>
</html>
