<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRỢ LÍ VẬT LÍ - THẦY TRẦN GẶP</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #071b26, #0d3545, #123f50);
    color: white;
}

.container {
    width: min(1100px, 94%);
    margin: 0 auto;
    padding: 45px 0;
}

.header {
    text-align: center;
    padding: 35px 20px;
    border-radius: 25px;
    background: linear-gradient(135deg, #0b536b, #174b75);
    border: 2px solid #338bd0;
    box-shadow: 0 10px 35px rgba(0,0,0,.35);
    margin-bottom: 35px;
}

.header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 48px);
    color: #65e8f5;
}

.header p {
    margin: 12px 0 0;
    font-size: 18px;
    color: #d9f7ff;
}

.section {
    margin-bottom: 28px;
}

.section-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
    padding: 12px 18px;
    border-left: 6px solid #43c9ef;
    background: rgba(255,255,255,.08);
    border-radius: 10px;
}

.lesson {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 24px;
    margin-bottom: 14px;
    background: rgba(10,25,40,.9);
    border: 1px solid rgba(100,200,255,.3);
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.lesson-name {
    font-size: 19px;
    font-weight: 600;
}

.lesson-button {
    display: inline-block;
    text-decoration: none;
    padding: 11px 22px;
    border-radius: 25px;
    background: linear-gradient(135deg, #29bde8, #637bea);
    color: #071522;
    font-weight: bold;
    white-space: nowrap;
    transition: transform .2s, box-shadow .2s;
}

.lesson-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(50,190,240,.4);
}

.empty {
    padding: 18px 22px;
    color: #a9bac5;
    background: rgba(255,255,255,.05);
    border-radius: 12px;
    font-style: italic;
}

.footer {
    text-align: center;
    margin-top: 45px;
    padding: 20px;
    color: #a9c4cf;
    font-size: 14px;
}

@media (max-width: 600px) {
    .container {
        width: 92%;
        padding: 25px 0;
    }

    .header {
        padding: 28px 15px;
    }

    .lesson {
        flex-direction: column;
        align-items: stretch;
        padding: 18px;
    }

    .lesson-button {
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>TRỢ LÍ VẬT LÍ</h1>
        <p>THẦY TRẦN GẶP</p>
    </div>

    <div class="section">
        <div class="section-title">📘 VẬT LÍ 11</div>

        <div class="lesson">
            <div class="lesson-name">
                🔵 Dao động điều hòa (1)
            </div>

            <a class="lesson-button"
               href="dao-dong-dieu-hoa.html">
                ▶ LÀM BÀI
            </a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📕 VẬT LÍ 12</div>

        <div class="empty">
            Các bài tập sẽ được cập nhật trong thời gian tới.
        </div>
    </div>

    <div class="footer">
        © TRỢ LÍ VẬT LÍ - THẦY TRẦN GẶP
    </div>

</div>

</body>
</html>
