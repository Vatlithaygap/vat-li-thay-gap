<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cấu trúc của chất. Sự chuyển thể (1)</title>
<style>
  :root{
    --bg1:#0f2027;
    --bg2:#203a43;
    --bg3:#2c5364;
    --accent:#38bdf8;
    --accent2:#818cf8;
    --green:#22c55e;
    --red:#ef4444;
    --card:#0f1b2b;
    --text:#f1f5f9;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--text);
    overflow:hidden;
    background:#05080b;
  }
  /* Khung sân khấu cố định 1280x720 (16:9), JS co giãn theo màn hình chiếu */
  #stage{
    position:fixed;
    top:50%;left:50%;
    width:1280px;height:720px;
    transform-origin:center center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    box-shadow:0 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  #app{
    height:100%;width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #fullscreen-btn{
    position:absolute;
    top:8px;right:18px;
    z-index:999;
    background:rgba(15,27,43,0.85);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(6px);
    transition:all .2s;
  }
  #fullscreen-btn:hover{
    background:rgba(56,189,248,0.25);
    border-color:var(--accent);
  }
  .header{
    text-align:center;
    margin-bottom:14px;
  }
  .header-banner{
    position:relative;
    width:1180px;
    height:147px;
    margin:0 auto 12px auto;
    padding:0;
    border-radius:26px;
    overflow:hidden;
    background:#102b34;
    border:1px solid rgba(125,211,252,0.28);
    box-shadow:0 10px 30px rgba(0,0,0,0.28);
  }
  .header-banner img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }
  .deco{ position:absolute; pointer-events:none; }
  .deco-school{
    left:16px; top:50%; transform:translateY(-50%);
    width:64px; height:64px; opacity:0.85;
  }
  .deco-molecule{
    right:16px; top:50%; transform:translateY(-50%);
    width:70px; height:70px; opacity:0.85;
    animation:spin-slow 14s linear infinite;
  }
  .deco-snow{ left:88px; top:8px; width:26px; height:26px; opacity:0.7; }
  .deco-thermo{ right:92px; top:6px; width:16px; height:34px; opacity:0.75; }
  .deco-drops{ left:0; bottom:4px; width:100%; height:16px; opacity:0.55; }
  @keyframes spin-slow{
    from{ transform:translateY(-50%) rotate(0deg); }
    to{ transform:translateY(-50%) rotate(360deg); }
  }
  @media (max-width:640px){
    .deco-school,.deco-molecule{ width:44px; height:44px; }
    .deco-snow,.deco-thermo{ display:none; }
  }
  .school-strip{
    position:relative;
    width:100%;
    height:86px;
    border-radius:18px 18px 0 0;
    overflow:hidden;
    margin:-22px -20px 14px -20px;
    width:calc(100% + 40px);
  }
  .school-strip img{
    width:100%;height:100%;object-fit:cover;
    filter:brightness(0.62) saturate(1.05);
  }
  .school-strip::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,32,39,0.15) 0%, rgba(15,32,39,0.55) 65%, rgba(15,32,39,0.92) 100%);
  }
  .school-id{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
  }
  .school-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.55);
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    background:#fff;
  }
  .school-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#e2e8f0;
    text-transform:uppercase;
  }
  .header h1{
    font-size:26px;
    margin:0 0 6px 0;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .progress-wrap{
    width:1180px;
    margin:0 auto 18px auto;
  }
  .progress-label{
    display:flex;justify-content:space-between;
    font-size:14px;color:var(--muted);margin-bottom:6px;
  }
  .progress-bar{
    width:100%;height:10px;border-radius:6px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .35s ease;
  }
  .card{
    width:1180px;
    background:rgba(15,27,43,0.85);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:22px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    position:relative;
    backdrop-filter:blur(6px);
    max-height:400px;
    overflow-y:auto;
  }
  .qnum-row{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    column-gap:18px;
    margin-bottom:22px;
  }
  .qnum{
    display:inline-block;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;
    font-weight:800;
    padding:6px 18px;
    border-radius:999px;
    font-size:15px;
    letter-spacing:1px;
  }
  .timer-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:999px;
    padding:6px 16px;
    font-weight:800;
    font-size:15px;
    min-width:70px;
    justify-content:center;
    transition:all .2s;
  }
  .timer-badge .clock-icon{font-size:16px;}
  .timer-badge.warn{
    border-color:#facc15;
    color:#facc15;
    background:rgba(250,204,21,0.12);
  }
  .timer-badge.danger{
    border-color:var(--red);
    color:var(--red);
    background:rgba(239,68,68,0.15);
    animation:pulse .6s infinite;
  }
  .timer-badge.stopped{
    opacity:0.4;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  .qtext{
    font-size:24px;
    line-height:1.35;
    margin:0;
    font-weight:600;
    min-width:0;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:18px;
  }
  @media (max-width:600px){
    .options{grid-template-columns:1fr;}
  }
  .opt-btn{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.12);
    color:var(--text);
    padding:14px 16px;
    border-radius:14px;
    font-size:24px;
    cursor:pointer;
    transition:all .18s ease;
    line-height:1.4;
  }
  .opt-btn:hover:not(.disabled){
    border-color:var(--accent);
    background:rgba(56,189,248,0.12);
    transform:translateY(-2px);
  }
  .opt-btn .badge{
    flex:0 0 auto;
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:21px;
  }
  .opt-btn.correct{
    background:rgba(34,197,94,0.22);
    border-color:var(--green);
  }
  .opt-btn.correct .badge{background:var(--green);color:#052e12;}
  .opt-btn.wrong{
    background:rgba(239,68,68,0.22);
    border-color:var(--red);
    animation:shake .35s;
  }
  .opt-btn.wrong .badge{background:var(--red);color:#3f0505;}
  .opt-btn.disabled{cursor:default;opacity:0.55;}
  .opt-btn.disabled.correct,.opt-btn.disabled.wrong{opacity:1;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .feedback{
    min-height:30px;
    font-weight:800;
    font-size:16px;
    margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .feedback.correct{color:var(--green);}
  .feedback.wrong{color:var(--red);}
  .answer-box{
    display:none;
    background:rgba(255,255,255,0.05);
    border-left:4px solid var(--red);
    border-radius:8px;
    padding:12px 16px;
    margin-top:6px;
  }
  .answer-box.show{display:block;}
  .answer-box .ans-line{
    font-weight:800;
    margin-bottom:4px;
  }
  .answer-box .ans-line span{color:var(--red);}
  .answer-box .exp-line{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .nav-row{
    width:1180px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    gap:12px;
  }
  .nav-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:var(--text);
    padding:12px 22px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:all .18s;
  }
  .nav-btn:hover:not(:disabled){
    background:rgba(56,189,248,0.2);
    border-color:var(--accent);
  }
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .nav-btn.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;
    border:none;
  }
  .molecule-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.15;
    z-index:0;
  }
  #finish-screen{
    display:none;
    text-align:center;
  }
  #finish-screen h2{
    font-size:30px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
  }
  #finish-screen .score{
    font-size:52px;
    font-weight:900;
    margin:16px 0;
  }
  #finish-screen p{color:var(--muted);font-size:16px;}
  .restart-btn{
    margin-top:20px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b1220;border:none;
    padding:14px 30px;border-radius:12px;
    font-weight:800;font-size:16px;cursor:pointer;
  }
/* Phương án dự phòng khi trình duyệt không hỗ trợ Fullscreen API */
body.fallback-fullscreen{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  overflow:auto !important;
  z-index:999999 !important;
  background:#fff !important;
}

/* FULLSCREEN FALLBACK - dùng được khi mở trực tiếp file HTML */
body.fallback-fullscreen{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  z-index:2147483647 !important;
  background:#0f2027 !important;
}
body.fallback-fullscreen #stage{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  width:100vw !important;
  height:100vh !important;
  min-height:0 !important;
  transform:none !important;
  overflow:hidden !important;
}

/* ===== FIX HIỂN THỊ ĐIỆN THOẠI — chỉ áp dụng cho màn hình <= 900px ===== */
@media screen and (max-width:900px){
  html,body{
    width:100%;
    height:100%;
    min-width:0;
    margin:0;
    padding:0;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  #stage{
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    height:100svh !important;
    min-width:0 !important;
    min-height:0 !important;
    max-width:none !important;
    max-height:none !important;
    margin:0 !important;
    transform:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    overflow:hidden !important;
  }

  #app{
    position:relative !important;
    width:100% !important;
    height:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    padding:
      58px
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left)) !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:stretch !important;
    justify-content:flex-start !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
    -webkit-overflow-scrolling:touch;
  }

  #fullscreen-btn{
    position:absolute !important;
    top:max(10px, env(safe-area-inset-top)) !important;
    right:max(10px, env(safe-area-inset-right)) !important;
    z-index:9999 !important;
    padding:8px 12px !important;
    font-size:14px !important;
    line-height:1.1 !important;
    white-space:nowrap !important;
    max-width:calc(100vw - 20px) !important;
  }

  .header-banner{
    width:100% !important;
    height:auto !important;
    aspect-ratio:1180 / 147 !important;
    min-height:0 !important;
    max-width:none !important;
    margin:0 0 10px 0 !important;
    flex:0 0 auto !important;
  }

  .progress-wrap{
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    flex:0 0 auto !important;
  }

  .card{
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    max-height:none !important;
    height:auto !important;
    min-height:0 !important;
    flex:0 0 auto !important;
    overflow:visible !important;
    padding:16px 14px !important;
    margin-bottom:12px !important;
  }

  .qnum-row{
    width:100% !important;
    min-width:0 !important;
    display:grid !important;
    grid-template-columns:auto minmax(0,1fr) auto !important;
    align-items:start !important;
    column-gap:8px !important;
    margin-bottom:14px !important;
  }

  .qnum{
    min-width:0 !important;
    white-space:nowrap !important;
    font-size:clamp(12px,3.6vw,16px) !important;
    padding:6px 10px !important;
  }

  .qtext{
    display:block !important;
    visibility:visible !important;
    min-width:0 !important;
    width:auto !important;
    font-size:clamp(17px,4.8vw,23px) !important;
    line-height:1.35 !important;
    overflow-wrap:anywhere !important;
  }

  .timer-badge{
    min-width:58px !important;
    padding:6px 8px !important;
    font-size:clamp(13px,3.8vw,16px) !important;
    gap:5px !important;
  }

  .options{
    display:grid !important;
    grid-template-columns:1fr !important;
    width:100% !important;
    min-width:0 !important;
    gap:10px !important;
    margin-bottom:14px !important;
  }

  .opt-btn{
    display:flex !important;
    width:100% !important;
    min-width:0 !important;
    font-size:clamp(16px,4.5vw,21px) !important;
    line-height:1.35 !important;
    padding:12px 13px !important;
    overflow-wrap:anywhere !important;
  }

  .nav-row{
    width:100% !important;
    max-width:none !important;
    min-width:0 !important;
    display:flex !important;
    flex-wrap:nowrap !important;
    gap:8px !important;
    flex:0 0 auto !important;
    padding:0 0 12px 0 !important;
  }

  .nav-btn{
    min-width:0 !important;
    flex:1 1 0 !important;
    min-height:48px !important;
    padding:10px 8px !important;
    font-size:clamp(15px,4.2vw,20px) !important;
    line-height:1.15 !important;
  }
}

@media screen and (max-width:420px){
  #app{
    padding-left:max(8px, env(safe-area-inset-left)) !important;
    padding-right:max(8px, env(safe-area-inset-right)) !important;
  }

  .qnum-row{
    grid-template-columns:auto minmax(0,1fr) auto !important;
  }

  .qtext{
    grid-column:1 / -1 !important;
    grid-row:2 !important;
    margin-top:7px !important;
  }
}
/* ===== END FIX ĐIỆN THOẠI ===== */

</style>
</head>

<script>
  function resizeStage(){
    const stage = document.getElementById('stage');
    if(!stage) return;

    const vv = window.visualViewport;
    const w = vv ? vv.width : window.innerWidth;
    const h = vv ? vv.height : window.innerHeight;

    if(w <= 900){
      stage.style.transform = 'none';
      stage.style.left = '0';
      stage.style.top = '0';
      stage.style.width = '100%';
      stage.style.height = '100svh';
    }else{
      const scale = Math.min(w/1280, h/720);
      stage.style.left = '50%';
      stage.style.top = '50%';
      stage.style.width = '1280px';
      stage.style.height = '720px';
      stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
    }
  }
  function toggleFullscreen(){
    const body = document.body;
    const doc = document;
    const root = document.documentElement;

    // Đang ở chế độ dự phòng: thoát.
    if(body.classList.contains('fallback-fullscreen')){
      body.classList.remove('fallback-fullscreen');
      resizeStage();
      updateFullscreenButton();
      return;
    }

    // Đang ở fullscreen thật: thoát.
    if(doc.fullscreenElement || doc.webkitFullscreenElement){
      try{
        if(doc.exitFullscreen){
          const p = doc.exitFullscreen();
          if(p && typeof p.then === 'function'){
            p.then(updateFullscreenButton).catch(updateFullscreenButton);
          }else{
            updateFullscreenButton();
          }
        }else if(doc.webkitExitFullscreen){
          doc.webkitExitFullscreen();
          updateFullscreenButton();
        }
      }catch(e){
        updateFullscreenButton();
      }
      return;
    }

    // Thử fullscreen thật và cập nhật nút ngay khi yêu cầu được chấp nhận.
    try{
      if(root.requestFullscreen){
        const p = root.requestFullscreen();
        if(p && typeof p.then === 'function'){
          p.then(()=>{
            updateFullscreenButton();
          }).catch(()=>{
            // file:// hoặc trình duyệt chặn Fullscreen API -> dùng dự phòng
            body.classList.add('fallback-fullscreen');
            resizeStage();
            updateFullscreenButton();
          });
        }else{
          updateFullscreenButton();
        }
        return;
      }

      if(root.webkitRequestFullscreen){
        root.webkitRequestFullscreen();
        updateFullscreenButton();
        return;
      }
    }catch(e){}

    // Chế độ dự phòng: luôn hoạt động khi mở file HTML trực tiếp từ ổ đĩa.
    body.classList.add('fallback-fullscreen');
    resizeStage();
    updateFullscreenButton();
  }

  function updateFullscreenButton(){
    const icon = document.getElementById('fs-icon');
    const label = document.getElementById('fs-label');
    const active = !!(document.fullscreenElement ||
                      document.webkitFullscreenElement ||
                      document.body.classList.contains('fallback-fullscreen'));

    if(icon) icon.textContent = active ? '⤓' : '⛶';
    if(label) label.textContent = active ? 'Thoát toàn màn hình' : 'Toàn màn hình';
  }

  window.addEventListener('resize', resizeStage, {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resizeStage, {passive:true});
    window.visualViewport.addEventListener('scroll', resizeStage, {passive:true});
  }
  document.addEventListener('fullscreenchange', ()=>{
    resizeStage();
    updateFullscreenButton();
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    resizeStage();
    updateFullscreenButton();
  });
  resizeStage();
</script>

/* ---------- Xáo trộn thứ tự câu hỏi và thứ tự đáp án mỗi lượt làm bài ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildShuffledQuestions(){
  const shuffledOrder = shuffleArray(questions);
  return shuffledOrder.map(q => {
    const optionOrder = shuffleArray([0,1,2,3]); // vị trí gốc của từng phương án sau khi xáo
    const newOptions = optionOrder.map(origIdx => q.o[origIdx]);
    const newCorrect = optionOrder.indexOf(q.a);
    return { q: q.q, o: newOptions, a: newCorrect, e: q.e, sourceLabel: q.sourceLabel || "" };
  });
}

let timeLeft = TIME_LIMIT;
let timerInterval = null;
let totalTimeSpent = 0;

/* ---------- Âm thanh (tổng hợp trực tiếp, không cần file, chạy offline) ---------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, duration, type, vol, delay){
  try{
    const ctx = getAudioCtx();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(vol||0.3, startAt);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.02);
  }catch(e){ /* trình duyệt chặn audio trước tương tác - bỏ qua an toàn */ }
}
function playCorrectSound(){
  playTone(784, 0.13, "sine", 0.28, 0);
  playTone(988, 0.13, "sine", 0.28, 0.11);
  playTone(1318, 0.22, "sine", 0.3, 0.22);
}
function playWrongSound(){
  playTone(220, 0.28, "sawtooth", 0.22, 0);
  playTone(160, 0.32, "sawtooth", 0.2, 0.1);
}
function playTimeUpSound(){
  playTone(300, 0.15, "square", 0.2, 0);
  playTone(220, 0.15, "square", 0.2, 0.16);
  playTone(140, 0.3, "square", 0.22, 0.32);
}

/* ---------- Đồng hồ đếm ngược 50 phút mỗi câu ---------- */
const timerBadgeEl = document.getElementById("timer-badge");
const timerTextEl = document.getElementById("timer-text");

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay(){
  timerTextEl.textContent = timeLeft;
  timerBadgeEl.classList.remove("warn","danger","stopped");
  if(timeLeft<=3 && timeLeft>0){ timerBadgeEl.classList.add("danger"); }
  else if(timeLeft<=6){ timerBadgeEl.classList.add("warn"); }
}
function startTimer(){
  stopTimer();
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      timeLeft = 0;
      updateTimerDisplay();
      stopTimer();
      handleTimeUp();
    } else {
      updateTimerDisplay();
    }
  },1000);
}
function freezeTimerDisplay(){
  stopTimer();
  timerBadgeEl.classList.add("stopped");
}
function handleTimeUp(){
  if(answered[current]) return;
  playTimeUpSound();
  const q = activeQuestions[current];
  const btns = optionsEl.querySelectorAll(".opt-btn");
  btns.forEach(b=>b.classList.add("disabled"));
  feedbackEl.textContent = "⏰ HẾT GIỜ!";
  feedbackEl.className = "feedback wrong";
  answered[current] = true;
  totalTimeSpent += TIME_LIMIT;
  revealAnswer(true);
  timerBadgeEl.classList.add("stopped");
  // Hết giờ vẫn phải mở hoàn toàn nút CÂU TIẾP THEO.
  nextBtn.disabled = false;
  nextBtn.style.opacity = "";
  nextBtn.style.cursor = "pointer";
}

const qnumEl = document.getElementById("qnum");
const qtextEl = document.getElementById("qtext");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const answerBoxEl = document.getElementById("answer-box");
const ansLetterEl = document.getElementById("ans-letter");
const expTextEl = document.getElementById("exp-text");
const progressTextEl = document.getElementById("progress-text");
const progressFillEl = document.getElementById("progress-fill");
const scoreTextEl = document.getElementById("score-text");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
const quizCard = document.getElementById("quiz-card");
const finishScreen = document.getElementById("finish-screen");
const navRow = document.getElementById("nav-row");
const progressWrap = document.getElementById("progress-wrap");

function formatScore(count){
  const scoreTable = [
    0, 0.3, 0.7, 1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.0,
    3.3, 3.7, 4.0, 4.3, 4.7, 5.0, 5.3, 5.7, 6.0, 6.3,
    6.7, 7.0, 7.3, 7.7, 8.0, 8.3, 8.7, 9.0, 9.3, 9.7, 10.0
  ];
  const score = scoreTable[Math.max(0, Math.min(30, count))];
  return score.toFixed(1).replace(".", ",");
}
function formatTotalTime(sec){
  const minutes = Math.floor(sec / 60);
  const seconds = sec % 60;
  return String(minutes).padStart(2,"0") + " phút " + String(seconds).padStart(2,"0") + " giây";
}
function updateTotalTimeResult(){
  const el = document.getElementById("total-time-result");
  if(el) el.textContent = formatTotalTime(totalTimeSpent);
}

function renderSlide(){
  const q = activeQuestions[current];
  qnumEl.textContent = "CÂU " + String(current+1).padStart(2,"0") + (q.sourceLabel ? " (" + q.sourceLabel + ")" : "");
  qtextEl.textContent = q.q;
  progressTextEl.textContent = "CÂU " + String(current+1).padStart(2,"0") + " / " + activeQuestions.length;
  progressFillEl.style.width = ((current+1)/activeQuestions.length*100) + "%";
  scoreTextEl.textContent = "Điểm: " + formatScore(correctCount);

  optionsEl.innerHTML = "";
  q.o.forEach((optText, idx)=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = '<span class="badge">'+letters[idx]+'</span><span>'+optText+'</span>';
    btn.onclick = ()=>selectAnswer(idx);
    optionsEl.appendChild(btn);
  });

  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  answerBoxEl.className = "answer-box";

  if(answered[current]){
    revealAnswer(true);
    freezeTimerDisplay();
  } else {
    startTimer();
  }

  prevBtn.disabled = (current===0);
  nextBtn.textContent = (current===activeQuestions.length-1) ? "HOÀN THÀNH" : "CÂU TIẾP THEO →";
  nextBtn.disabled = !answered[current];
  nextBtn.style.opacity = answered[current] ? "" : "0.45";
  nextBtn.style.cursor = answered[current] ? "pointer" : "not-allowed";
}

function selectAnswer(idx){
  if(answered[current]) return; // đã trả lời rồi, khóa không cho chọn lại
  const q = activeQuestions[current];
  const btns = optionsEl.querySelectorAll(".opt-btn");
  answered[current] = true;
  totalTimeSpent += (TIME_LIMIT - timeLeft);
  freezeTimerDisplay();
  if(idx === q.a){
    playCorrectSound();
    btns[idx].classList.add("correct");
    feedbackEl.textContent = "✓ CHÍNH XÁC!";
    feedbackEl.className = "feedback correct";
    correctCount++;
    scoreTextEl.textContent = "Điểm: " + formatScore(correctCount);
  } else {
    playWrongSound();
    btns[idx].classList.add("wrong");
    feedbackEl.textContent = "✗ CHƯA ĐÚNG!";
    feedbackEl.className = "feedback wrong";
  }
  btns.forEach(b=>b.classList.add("disabled"));
  revealAnswer(false);
  nextBtn.disabled = false;
  nextBtn.style.opacity = "";
  nextBtn.style.cursor = "pointer";
}

function revealAnswer(instant){
  const q = activeQuestions[current];
  ansLetterEl.textContent = letters[q.a];
  expTextEl.textContent = "GIẢI THÍCH: " + q.e;
  answerBoxEl.classList.add("show");
  const btns = optionsEl.querySelectorAll(".opt-btn");
  btns[q.a].classList.add("correct");
  btns.forEach(b=>b.classList.add("disabled"));
}

function nextSlide(){
  // Bắt buộc chọn một đáp án (đúng hoặc sai) trước khi sang câu tiếp theo.
  if(!answered[current]){
    alert("Hãy chọn một đáp án trước khi sang câu tiếp theo.");
    return;
  }
  if(current === activeQuestions.length-1){
    showFinish();
    return;
  }
  current++;
  renderSlide();
}

function prevSlide(){
  if(current===0) return;
  current--;
  renderSlide();
}

function showFinish(){
  stopTimer();
  quizCard.style.display = "none";
  navRow.style.display = "none";
  progressWrap.style.display = "none";
  finishScreen.style.display = "block";
  document.getElementById("final-score").textContent = "Điểm: " + formatScore(correctCount);
  updateTotalTimeResult();
}

function restartQuiz(){
  stopTimer();
  activeQuestions = buildShuffledQuestions();
  current = 0;
  answered = new Array(activeQuestions.length).fill(false);
  correctCount = 0;
  totalTimeSpent = 0;
  updateTotalTimeResult();
  quizCard.style.display = "block";
  navRow.style.display = "flex";
  progressWrap.style.display = "block";
  finishScreen.style.display = "none";
  renderSlide();
}

renderSlide();

</script>
</body>
</html>
